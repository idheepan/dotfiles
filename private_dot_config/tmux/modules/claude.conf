# vim:set ft=tmux:
# One catppuccin-style status module for Claude usage; values are published by
# ~/.local/bin/claude-tmux. Layout: [cap][logo]  10% 󰔟 5%  14:30 󰃭 51%  10/12 09:00 !/?/● [cap]
# The context percent only shows in a window with a Claude pane. The trailing icon
# summarises every window in this session: ! error, ? needs you, ● done (in that order).
%hidden MODULE_NAME="claude"

set -g @catppuccin_claude_icon " "
set -gF @catppuccin_claude_color "#{E:@thm_lavender}"
set -g @catppuccin_claude_text " #{?#{@claude_ctx_val},  #{@claude_ctx_val},}#{?#{@claude_5h_val}, 󰔟 #{@claude_5h_val}#{?#{@claude_5h_reset},  #{@claude_5h_reset},},}#{?#{@claude_7d_val}, 󰃭 #{@claude_7d_val}#{?#{@claude_7d_reset},  #{@claude_7d_reset},},}#{?#{m:*error*,#{W:#{@claude_state} }}, !,#{?#{m:*needs*,#{W:#{@claude_state} }}, ?,#{?#{m:*done*,#{W:#{@claude_state} }}, ●,}}}"

source -F "#{d:current_file}/../plugins/catppuccin/tmux/utils/status_module.conf"
