# vim:set ft=tmux:
# One catppuccin-style status module for Claude usage; values are published by
# ~/.local/bin/claude-tmux. Layout: [cap][logo]  10% 󰔟 5% 󰃭 51% [cap]
%hidden MODULE_NAME="claude"

set -g @catppuccin_claude_icon " "
set -gF @catppuccin_claude_color "#{E:@thm_lavender}"
set -g @catppuccin_claude_text "  #{@claude_ctx_val}#{?#{@claude_5h_val}, 󰔟 #{@claude_5h_val},}#{?#{@claude_7d_val}, 󰃭 #{@claude_7d_val},}"

source -F "#{d:current_file}/../plugins/catppuccin/tmux/utils/status_module.conf"
