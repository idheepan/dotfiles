# Ensure true color support for Neovim and Catppuccin
set -g default-terminal "tmux-256color"
# Override for Ghostty and standard xterm true-color over SSH
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Recommended by Neovim for avoiding Esc-key delay
set -sg escape-time 10
# Recommended by Neovim for autoread
set -g focus-events on

# Enable mouse support (resizing panes, clicking windows, scrolling)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Keep window names exactly as I set them (prefix + ,). Without this, tmux
# renames a window to match whichever pane is active, and programs (agents,
# shells) can rename it via terminal title escape sequences.
set-option -g allow-rename off
set-window-option -g automatic-rename off

# ==========================================
# Copy / Paste (OSC 52 & macOS Integration)
# ==========================================
# Enable OSC 52 clipboard integration.
# This passes copied text through SSH directly to Ghostty and your Mac clipboard.
set -s set-clipboard on

# Use vi keybindings in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Split windows with \ and -
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Move between panes using ALT keys
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ==========================================
# Catppuccin theme (matches nvim/starship/ghostty)
# Requires a Nerd Font in your terminal for icons to render.
# ==========================================
set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_number_position 'right'

# Default window text is " #T" (the active pane's title, set via terminal
# escape sequences by the shell/programs), so it changes as you switch
# panes. Use "#W" (the window name) instead so it stays fixed.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status bar layout (loaded after the theme so the modules exist).
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
