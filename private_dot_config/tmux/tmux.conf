# Ensure true color support for Neovim and Catppuccin
set -g default-terminal "tmux-256color"
# Override for Ghostty and standard xterm true-color over SSH
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Recommended by Neovim for avoiding Esc-key delay
set -sg escape-time 10
# Recommended by Neovim for autoread
set -g focus-events on

# Enable mouse support (resizing panes, clicking windows, scrolling)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================================
# Copy / Paste (OSC 52 & macOS Integration)
# ==========================================
# Enable OSC 52 clipboard integration.
# This passes copied text through SSH directly to Ghostty and your Mac clipboard.
set -s set-clipboard on

# Use vi keybindings in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Pick a softer palette.
set -g @catppuccin_flavor 'mocha'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line more pleasant.
set -g status-left ""
set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '

# Ensure that everything on the right side of the status line
# is included.
set -g status-right-length 100
# ==========================================
# Plugins (Requires Tmux Plugin Manager)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless navigation between tmux panes and Neovim splits
set -g @plugin 'christoomey/vim-tmux-navigator'

# Handles yanking to system clipboard across environments
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
